; Memory & uploads
memory_limit = 256M
post_max_size = 32M
upload_max_filesize = 32M

; Performance
max_execution_time = 60
max_input_time = 60

; OPcache. Raise max_accelerated_files if the number of loaded PHP files
; (app + vendor) ever comes near it: a full OPcache recompiles on every request.
opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 30000
opcache.validate_timestamps = 0
opcache.save_comments = 1
; JIT off: the tracing JIT can slow Filament/Livewire requests down to tens of
; seconds after a few requests per worker, and it gains nothing for a
; request-shaped Laravel workload.
opcache.jit = disable
opcache.jit_buffer_size = 0

; Security
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
; stderr ends up in the container log (`docker/compose.sh logs`); storage/logs is not persisted.
error_log = /proc/self/fd/2

; Session
session.cookie_httponly = 1
session.cookie_secure = 1
session.use_strict_mode = 1
