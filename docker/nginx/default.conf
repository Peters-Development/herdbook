server {
    listen 80;
    index index.php;
    root /var/www/public;

    client_max_body_size 32M;

    # No nginx version in headers and error pages.
    server_tokens off;

    # Resolve `app` through Docker's DNS at request time: a recreated app
    # container gets a new IP, and a name resolved once at startup would
    # keep pointing at the old one (502 until nginx restarts).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream app:9000;

    location / {
        # Static files (CSS, JS, fonts, icons): the app's own responses get
        # their headers from Laravel (App\Http\Middleware\SecurityHeaders).
        add_header X-Content-Type-Options nosniff always;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
