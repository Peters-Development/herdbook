# Local development. Production runs docker/docker-compose.prod.yml.
# Ports bind to 127.0.0.1 only and use the 16000 range, clear of other local stacks.
name: herdbook

x-php: &php
    build:
        context: ./
        dockerfile: docker/Dockerfile
        target: dev
        args:
            user: user
            uid: ${HOST_UID:-501}
    image: herdbook-dev
    restart: unless-stopped
    working_dir: /var/www
    volumes:
        - ./:/var/www
    networks:
        - main

services:
    app:
        <<: *php
        container_name: herdbook-app
        depends_on:
            mysql:
                condition: service_healthy

    queue:
        <<: *php
        container_name: herdbook-queue
        command: php artisan queue:work --queue=checks,default --tries=3 --timeout=60
        depends_on:
            mysql:
                condition: service_healthy
            app:
                condition: service_started

    queue-checks:
        <<: *php
        container_name: herdbook-queue-checks
        command: php artisan queue:work --queue=checks --tries=3 --timeout=60
        depends_on:
            mysql:
                condition: service_healthy
            app:
                condition: service_started

    scheduler:
        <<: *php
        container_name: herdbook-scheduler
        command: php artisan schedule:work
        depends_on:
            mysql:
                condition: service_healthy
            app:
                condition: service_started

    web:
        container_name: herdbook-web
        image: nginx:stable-alpine
        restart: unless-stopped
        ports:
            - 127.0.0.1:16000:80
        volumes:
            - ./:/var/www:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app
        networks:
            - main

    mysql:
        container_name: herdbook-mysql
        image: mysql:8.4
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_USER: ${DB_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
        volumes:
            - mysql-data:/var/lib/mysql
        ports:
            - 127.0.0.1:16336:3306
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
            interval: 5s
            timeout: 3s
            retries: 10
        networks:
            - main

    mailpit:
        container_name: herdbook-mailpit
        image: axllent/mailpit
        restart: unless-stopped
        ports:
            - 127.0.0.1:16025:8025
        networks:
            - main

networks:
    main:
        driver: bridge

volumes:
    # The same volume name as the production stack's (docs/installation.md
    # warns about running both on one machine).
    mysql-data:
        name: herdbook_mysql-data
